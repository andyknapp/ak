<!doctype html>
<html lang="{{ metadata.language }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or metadata.title }}</title>
    <meta
      name="description"
      content="{{ metaDescription or metadata.description }}"
    />
    <link
      rel="preload"
      href="/fonts/Figtree-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Editing this script's contents requires updating its CSP sha256 hash in netlify.toml -->
    <script>
      (function () {
        var t =
          localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light');
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <a href="#main" class="visually-hidden">Skip to main content</a>

    {% include "components/header.html" %} {% include "components/nav.html" %}

    <main id="main" class="main-content">
      <div class="container container--main">{{ content | safe }}</div>
    </main>

    {% include "components/footer.html" %}
  </body>

  <script src="/js/index.js" async></script>
  {% if env.isProduction %}
  <!-- Cloudflare Web Analytics -->
  <script
    type="module"
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token": "8a31e765354d4fa28f217a73a1d606b0"}'
  ></script>
  <!-- End Cloudflare Web Analytics -->
  {% endif %}
</html>
